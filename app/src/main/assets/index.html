<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CaseBattle">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>CASE//BATTLE — кейсы CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c13;--bg2:#11141f;--bg3:#181c2b;--line:#252a3d;--txt:#e9ecf6;--mut:#8890aa;--acc:#ffb02e;--acc2:#ff6a00;--good:#3ddc84;--bad:#ff4d5e;--vio:#8b5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(1000px 500px at 80% -10%,#3a1f6a40,transparent),radial-gradient(800px 400px at 0% 0%,#ff6a0018,transparent),var(--bg);color:var(--txt);font-family:Rubik,system-ui,Segoe UI,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
h1,h2,h3{margin:0}
h2{font-size:20px;margin:22px 0 12px}
header{position:sticky;top:0;z-index:30;background:#0a0c13e6;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1400px;margin:auto;flex-wrap:wrap}
.logo{font-weight:900;font-size:21px;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo b{color:var(--acc);text-shadow:0 0 18px #ffb02e88}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:10px;font-weight:500;white-space:nowrap;transition:.15s}
nav button:hover{color:var(--txt);background:var(--bg3)}
nav button.on{color:#111;background:linear-gradient(135deg,var(--acc),var(--acc2));font-weight:700}
.hr{display:flex;gap:8px;align-items:center}
.bal{background:var(--bg3);border:1px solid var(--line);padding:7px 12px;border-radius:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.bal span{color:var(--acc)}
.ib{background:var(--bg3);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:17px;display:grid;place-items:center}
.ib:hover{border-color:var(--acc)}
.meav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer;position:relative}
.meav i{position:absolute;bottom:-5px;right:-5px;font-style:normal;font-size:10px;background:var(--acc);color:#000;border-radius:6px;padding:0 4px;font-weight:700}
@media(max-width:820px){nav{order:3;flex:1 0 100%}.logo{font-size:18px}.hr{margin-left:auto}}
#ticker{display:flex;gap:6px;overflow:hidden;padding:6px 16px;max-width:1400px;margin:auto;height:62px}
.tk{flex:0 0 92px;height:50px;background:var(--bg2);border-radius:9px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:tkin .4s}
.tk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rc)}
.tk::before{content:'';position:absolute;inset:0;background:radial-gradient(60px 30px at 50% 100%,var(--rc),transparent);opacity:.25}
.tk img{height:30px;max-width:80px;object-fit:contain;position:relative}
.tk span{font-size:9px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86px;position:relative}
@keyframes tkin{from{transform:translateX(-30px);opacity:0}}
main{max-width:1400px;margin:auto;padding:8px 16px 60px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#111;border:0;border-radius:12px;padding:11px 20px;font-weight:700;transition:.15s;box-shadow:0 6px 20px #ff8a0030}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.green{background:linear-gradient(135deg,#3ddc84,#16a34a)}
.btn.red{background:linear-gradient(135deg,#ff5f6d,#d61f3a);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.big{padding:15px 28px;font-size:17px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{border-radius:20px;padding:26px;margin:10px 0 18px;background:linear-gradient(120deg,#ff6a0030,#8b5cff30),var(--bg2);border:1px solid var(--line);position:relative;overflow:hidden}
.hero h1{font-size:30px;font-weight:900}
.hero p{color:var(--mut);margin:8px 0 0}
.hero .gl{position:absolute;right:-20px;top:-40px;opacity:.1;transform:rotate(-15deg);color:var(--acc)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.case{background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.case::before{content:'';position:absolute;inset:auto 0 -40px 0;height:120px;background:radial-gradient(closest-side,#ffb02e33,transparent)}
.case:hover{transform:translateY(-4px);border-color:var(--acc)}
.case img{width:100%;aspect-ratio:4/3;object-fit:contain;position:relative;transition:.25s}
.case:hover img{transform:scale(1.07) rotate(-2deg)}
.case .cn{font-weight:600;font-size:13px;margin-top:6px;position:relative}
.case .cp{display:inline-block;margin-top:8px;background:#000a;border:1px solid #ffb02e55;color:var(--acc);padding:4px 10px;border-radius:9px;font-weight:700;font-size:13px;position:relative}
.case .new{position:absolute;top:8px;left:8px;background:var(--good);color:#000;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;z-index:2}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.icard{position:relative;background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;overflow:hidden;transition:.15s}
.icard::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.icard::before{content:'';position:absolute;inset:auto -20% -50% -20%;height:90%;background:radial-gradient(closest-side,var(--rc),transparent);opacity:.22;pointer-events:none}
.icard img{width:100%;aspect-ratio:4/3;object-fit:contain;position:relative;filter:drop-shadow(0 6px 10px #000c)}
.icard .itop{display:flex;justify-content:space-between;font-size:11px;position:relative}
.icard .wear{color:var(--mut)}
.icard .ip{color:var(--acc);font-weight:700}
.icard .iw{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.icard .is{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.icard .ch{font-size:11px;color:var(--mut);position:relative}
.icard .btn{margin-top:6px;width:100%;position:relative}
.icard.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.icard.click{cursor:pointer}
.icard.click:hover{border-color:#ffffff40;transform:translateY(-2px)}
.stt{color:#cf6a32;font-weight:700}
.cphead{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:10px 0}
.cphead>img{width:260px;max-width:60vw;filter:drop-shadow(0 10px 30px #ffb02e44);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.cphead h1{font-size:28px;font-weight:900}
.seg{display:inline-flex;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--mut);padding:7px 12px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--acc);color:#111}
.back{background:none;border:0;color:var(--mut);padding:6px 0;font-weight:500}
.back:hover{color:var(--txt)}
.reelvp{position:relative;overflow:hidden;height:150px;background:linear-gradient(180deg,#06070c,#0d1018);border:1px solid var(--line);border-radius:14px;margin:8px 0}
.reelvp.sm{height:118px}
.reelvp .track{display:flex;height:100%;will-change:transform}
.reelvp .mark,.vreel .mark{position:absolute;z-index:3;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.reelvp .mark{left:50%;top:0;bottom:0;width:3px;transform:translateX(-1.5px)}
.reelvp::before,.reelvp::after{content:'';position:absolute;top:0;bottom:0;width:18%;z-index:2;pointer-events:none}
.reelvp::before{left:0;background:linear-gradient(90deg,#06070c,transparent)}
.reelvp::after{right:0;background:linear-gradient(-90deg,#06070c,transparent)}
.rc{flex:0 0 auto;height:100%;padding:5px;position:relative}
.rc>div{height:100%;border-radius:10px;background:linear-gradient(180deg,#161a28,#10131d);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.rc>div::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.rc>div::before{content:'';position:absolute;inset:auto -10% -40% -10%;height:80%;background:radial-gradient(closest-side,var(--rc),transparent);opacity:.3}
.rc img{width:92%;height:62%;object-fit:contain;position:relative}
.rc span{font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%;position:relative}
.rc b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%;position:relative;font-weight:600}
.rc.win>div{box-shadow:0 0 0 2px var(--rc) inset,0 0 30px var(--rc)}
.vreel{position:relative;overflow:hidden;height:330px;background:linear-gradient(90deg,#06070c,#0d1018);border:1px solid var(--line);border-radius:14px}
.vreel .track{display:flex;flex-direction:column;will-change:transform}
.vreel .rc{width:100%}
.vreel .mark{top:50%;left:0;right:0;height:3px;transform:translateY(-1.5px)}
.vreel::before,.vreel::after{content:'';position:absolute;left:0;right:0;height:30%;z-index:2;pointer-events:none}
.vreel::before{top:0;background:linear-gradient(180deg,#06070c,transparent)}
.vreel::after{bottom:0;background:linear-gradient(0deg,#06070c,transparent)}
#modal{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#modal.on{display:flex}
#modal .mb{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,200px));gap:12px;justify-content:center;margin:16px 0}
.drops .icard{animation:drop .5s backwards}
@keyframes drop{from{transform:translateY(20px) scale(.8);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--bg3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a;animation:pop .2s;font-weight:500}
.tst.good{border-color:var(--good)}.tst.bad{border-color:var(--bad)}
.bset{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bcase{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.bcase img{width:100%;aspect-ratio:4/3;object-fit:contain}
.bcase .x{position:absolute;top:4px;right:4px;background:var(--bad);border:0;color:#fff;border-radius:7px;width:22px;height:22px;font-size:12px}
.bcase div{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcase b{font-size:12px;color:var(--acc)}
.addc{border:2px dashed var(--line);border-radius:12px;background:none;color:var(--mut);min-height:120px;font-size:30px}
.addc:hover{border-color:var(--acc);color:var(--acc)}
.arena .rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.arena .rounds img{height:46px;padding:4px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);opacity:.45}
.arena .rounds img.cur{opacity:1;border-color:var(--acc);box-shadow:0 0 12px #ffb02e66}
.arena .rounds img.done{opacity:.8}
.cols{display:grid;grid-template-columns:repeat(var(--p),1fr);gap:10px;margin-top:10px}
.pcol{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0;transition:.3s}
.pcol.win{border-color:var(--good);box-shadow:0 0 30px #3ddc8444}
.pcol.lose{opacity:.55}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.phead .pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ptotal{font-weight:700;color:var(--acc);white-space:nowrap}
.pitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;margin-top:8px}
.pitems .mini{background:var(--bg3);border-radius:8px;padding:3px;text-align:center;position:relative;overflow:hidden;animation:drop .4s}
.pitems .mini::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rc)}
.pitems .mini img{width:100%;aspect-ratio:4/3;object-fit:contain}
.pitems .mini div{font-size:10px;color:var(--acc);font-weight:700}
.banner{text-align:center;padding:18px;border-radius:16px;margin-top:12px;font-size:22px;font-weight:900;animation:pop .3s}
.banner.w{background:linear-gradient(120deg,#3ddc8430,#16a34a20);border:1px solid var(--good)}
.banner.l{background:linear-gradient(120deg,#ff4d5e30,#d61f3a20);border:1px solid var(--bad)}
.ugrid{display:grid;grid-template-columns:1fr 340px 1fr;gap:14px;align-items:start}
@media(max-width:1000px){.ugrid{grid-template-columns:1fr}}
.ugrid .igrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));max-height:520px;overflow:auto;padding-right:4px}
.wheel{position:relative;width:260px;height:260px;margin:10px auto}
.wheel svg{width:100%;height:100%}
.wheel .ptr{position:absolute;inset:0;transition:transform 4.5s cubic-bezier(.1,.7,.15,1)}
.wheel .ptr::before{content:'';position:absolute;left:50%;top:2px;transform:translateX(-50%);border:11px solid transparent;border-top:22px solid #fff;filter:drop-shadow(0 0 8px #fff)}
.wheel .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wheel .ctr b{font-size:38px;font-weight:900}
.uslot{display:flex;gap:10px;justify-content:center;align-items:center}
.uslot .box{flex:1;min-height:120px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mut);font-size:12px;padding:6px;text-align:center}
.uslot .box .icard{width:100%}
.mults{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.crash{position:relative;height:400px;background:linear-gradient(180deg,#0d1018,#06070c);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crash canvas{width:100%;height:100%;display:block}
.crash .cm{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:52px;font-weight:900;pointer-events:none;text-shadow:0 0 30px #000}
.crctl{display:grid;grid-template-columns:1fr 220px 280px;gap:14px;align-items:end;margin-top:12px}
.crctl .field{margin:0}.crctl #crgo{height:52px}
@media(max-width:800px){.crctl{grid-template-columns:1fr}.crash{height:300px}}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
nav .ic{margin-right:6px}.ib .ic{width:19px;height:19px}
.hero .gl svg{width:230px;height:230px;stroke-width:1.3}
.mcell svg{width:55%;height:55%}
.case.cust::before{background:radial-gradient(closest-side,#8b5cff40,transparent)}
.cbadge{position:absolute;top:10px;right:10px;z-index:2;background:#0d1018d9;border:1px solid #ffffff30;color:#fff;font-weight:900;font-size:10px;letter-spacing:.5px;padding:3px 7px;border-radius:7px;backdrop-filter:blur(4px)}
.cbadge.gold{background:linear-gradient(135deg,#ffe08a,#c98b12);color:#2a1a00;border:0;box-shadow:0 0 14px #e4ae3988}
.cbadge.inl{position:static;font-size:13px;vertical-align:middle;margin-left:6px}
.case.cust{border-color:#8b5cff40}
.meav img,.bigav img,.av img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.meav,.av{font-weight:900;color:#fff;font-size:17px;overflow:visible}
.av{overflow:hidden}
.prof .bigav{position:relative;font-weight:900;color:#fff;font-size:42px}
.bigav .avedit{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:10px;background:var(--acc);color:#111;display:grid;place-items:center;box-shadow:0 4px 10px #0008}
.bigav .avedit .ic{width:16px;height:16px}
.regav{width:96px;height:96px;border-radius:26px;font-size:40px;color:#fff;display:grid;place-items:center;cursor:pointer;border:2px dashed #ffffff50}
@media(max-width:640px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.case{padding:10px}.case .cn{font-size:12px}}
.upstage{display:grid;grid-template-columns:1fr 300px 1fr;grid-template-areas:"a w b" "c c c";gap:14px;align-items:center;background:radial-gradient(500px 260px at 50% 40%,#3ddc8414,transparent),var(--bg2)}
#ufrom{grid-area:a}#uto{grid-area:b}.uwheelc{grid-area:w}.ubar{grid-area:c;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.ubar .mults{margin:0}.ubar #ugo{min-width:240px}
@media(max-width:800px){.upstage{grid-template-columns:1fr 1fr;grid-template-areas:"w w" "a b" "c c"}.ubar #ugo{width:100%}}
.uslotc{min-height:200px;border-radius:16px;background:#0b0d14;border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.uslotc .icard{width:100%;max-width:200px}
.ulab{font-size:12px;color:var(--mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.uempty{font-size:46px;color:#2d3349;font-weight:900;display:flex;flex-direction:column;align-items:center}
.uempty span{font-size:12px;color:var(--mut);font-weight:400}
.umulti{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
.umulti img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--bg3);border-radius:8px;border-bottom:2px solid var(--rc)}
.usum{font-weight:900;color:var(--acc);font-size:20px;margin-top:8px}
.uwheelc .wheel{width:280px;height:280px;max-width:80vw;max-height:80vw;margin:0 auto}
.wheel .ptr::before{top:-4px;border:12px solid transparent;border-top:24px solid #fff}
.wheel .ctr img{width:58%;object-fit:contain;filter:drop-shadow(0 6px 14px #000)}
.wheel.uwin svg{animation:uwin 1s}.wheel.ulose svg{animation:ulose 1s}
@keyframes uwin{30%{filter:drop-shadow(0 0 30px #3ddc84)}}
@keyframes ulose{30%{filter:drop-shadow(0 0 30px #ff4d5e)}}
.uinfo{display:flex;justify-content:center;gap:10px;margin-top:10px}
.uinfo div{background:#0b0d14;border:1px solid var(--line);border-radius:12px;padding:8px 16px;text-align:center;min-width:110px}
.uinfo span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.uinfo b{font-size:22px;font-weight:900}
#uch{color:var(--good)}
.ulists{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ulists .igrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));max-height:460px;overflow:auto;padding-right:4px}
@media(max-width:800px){.ulists{grid-template-columns:1fr}.ulists .igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mpre button.on{background:var(--acc);color:#111;border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);padding:0;margin-top:8px}
.mwin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.mwin div{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:8px 10px}

 <div class="panel"><h3 style="margin:0 0 12px">Себе</h3><div class="row"><input id="aself" type="number" value="10000" style="flex:1"><button class="btn green" id="aselfb">Начислить</button></div>
  <div class="row" style="margin-top:10px"><input id="aset" type="number" placeholder="Точный баланс" style="flex:1"><button class="btn ghost" id="asetb">Установить</button></div>
  <h3 style="margin:18px 0 10px">Созданные коды</h3><div class="hist" id="ahist">${hist.slice(0,30).map(h=>`<div class="hl" style="--rc:var(--acc)"><div class="t">${fmt(h.a)} → ${esc(h.t==='*'?'любой':h.t)}</div><button class="btn sm ghost" data-c="${esc(h.c)}">Копировать</button></div>`).join('')||'<div class="mut">Пока нет</div>'}</div>
  <button class="btn ghost sm" id="aexit" style="margin-top:16px;color:var(--bad)">Выйти из админки на этом устройстве</button></div></div>`;
 $$('.qb [data-v]').forEach(b=>b.onclick=()=>$('#aam').value=b.dataset.v);
 $('#atop').onclick=()=>pasteInto('#ato');$('#atome').onclick=()=>{$('#ato').value=pid()};
 $('#aall').onchange=e=>$('#ato').disabled=e.target.checked;
 const copy=t=>copyText(t);
 $$('#ahist [data-c]').forEach(b=>b.onclick=()=>copy(b.dataset.c));
 $('#agen').onclick=async()=>{const a=Math.floor(+$('#aam').value),all=$('#aall').checked,to=$('#ato').value.replace(/\s+/g,'');if(!(a>0))return toast('Укажи сумму','bad');if(!all&&!to)return toast('Укажи ID игрока','bad');
  const code=await makeCode(a,all?'*':to);hist.unshift({a,t:all?'*':to,c:code,d:Date.now()});localStorage.setItem('cb_codes',JSON.stringify(hist.slice(0,100)));
  $('#aout').innerHTML=`<div class="mut" style="font-size:12px;margin-bottom:6px">Отправь этот код игроку — он вводит его в профиле:</div><textarea readonly rows="4" style="width:100%;font-size:12px;color:var(--txt);background:var(--bg3);border:1px solid var(--acc);border-radius:10px;padding:10px">${code}</textarea><button class="btn" id="acp" style="width:100%;margin-top:6px">Копировать код</button>`;
  $('#acp').onclick=()=>copy(code);$('#aout textarea').onclick=e=>e.target.select()};
 $('#aselfb').onclick=()=>{const v=Math.floor(+$('#aself').value);if(v){S.bal+=v;save();bump();toast('+'+fmt(v),'good')}};
 $('#asetb').onclick=()=>{const v=Math.floor(+$('#aset').value);if(v>=0){S.bal=v;save();bump();toast('Баланс: '+fmt(v),'good')}};
 $('#aexit').onclick=()=>{localStorage.removeItem('cb_admin');ADMK=null;updAdminNav();go('cases')}}

/* ================= СТАРТ ================= */
(async()=>{
 updHead();
 let cached=null;try{cached=JSON.parse(localStorage.getItem(DBKEY)||'null')}catch(e){}
 if(cached&&cached.cases&&cached.cases.length){DB=cached;if(Date.now()-cached.t>3*864e5)loadRemote().then(db=>{if(db)try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){}})}
 else{DB=await loadRemote();if(DB){try{localStorage.setItem(DBKEY,JSON.stringify(DB))}catch(e){}}
  else{$('#ltxt').innerHTML='Не удалось загрузить базу CS2 (нужен интернет / GitHub).<br><br><button class="btn" onclick="location.reload()">Повторить</button> <button class="btn ghost" id="demoDB">Демо-режим</button>';
   await new Promise(r=>$('#demoDB').onclick=r);DB=fallbackDB()}}
 prepDB();loadAdmin();$('#loader').remove();go('cases');if(!S.reg)regModal();
 for(let i=0;i<14;i++){const c=rnd(DB.all);pushTicker(rollCase(c,true),rnd(BOTS))}
 setInterval(()=>{if(document.hidden)return;const c=rnd(DB.all);pushTicker(rollCase(c,true),rnd(BOTS))},2200);
})();
</script>
</body>
</html>
