name: Update prices
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/update_prices.py']
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install brotli
      - run: python3 scripts/update_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update Steam prices" && git push)
